name: Build Unity Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  UNITY_VERSION: 6000.0
  PROJECT_PATH: .

jobs:
  # ============ 自检模式:无 Unity 账号时跑 ============
  selfcheck:
    name: Self-check (no Unity account)
    runs-on: ubuntu-latest
    if: ${{ secrets.UNITY_EMAIL == '' || secrets.UNITY_PASSWORD == '' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List project structure
        run: |
          echo "=== 项目结构 ==="
          find . -type f -not -path './.git/*' -not -path './archive/*' | head -50
          echo ""
          echo "=== C# 脚本数 ==="
          find ./Assets -name "*.cs" | wc -l

      - name: C# 语法自检
        run: |
          echo "=== C# 大括号配对 ==="
          for f in $(find ./Assets -name "*.cs"); do
            opens=$(grep -c '{' "$f" || echo 0)
            closes=$(grep -c '}' "$f" || echo 0)
            if [ "$opens" != "$closes" ]; then
              echo "❌ $f: 大括号不配对"
              exit 1
            fi
          done
          echo "✅ 所有 C# 大括号配对正常"

      - name: Android Manifest 检查
        run: |
          if grep -q 'android:screenOrientation="landscape"' ./Assets/Plugins/Android/AndroidManifest.xml; then
            echo "✅ AndroidManifest landscape 配置正确"
          else
            echo "❌ AndroidManifest 缺少 landscape"
            exit 1
          fi

      - name: 配置指引(手机也能完成)
        run: |
          echo "=================================================="
          echo "📋 当前 CI 处于「自检模式」"
          echo "=================================================="
          echo ""
          echo "原因:未配置 UNITY_EMAIL / UNITY_PASSWORD secrets"
          echo ""
          echo "═══════════════════════════════════════════════"
          echo "📱 手机端配置步骤(约 5 分钟)"
          echo "═══════════════════════════════════════════════"
          echo ""
          echo "【步骤 1】注册 Unity ID(1 分钟)"
          echo "  手机浏览器打开:"
          echo "  https://id.unity.com/en/account/new"
          echo "  填邮箱+密码+全名+国家选 China"
          echo "  收邮件点验证链接"
          echo ""
          echo "【步骤 2】配 2 个 GitHub Secret(4 分钟)"
          echo "  手机打开:"
          echo "  https://github.com/Kdkdmwnwdkd/dingfengbo/settings/secrets/actions"
          echo "  点 New repository secret,加这两个:"
          echo "  - Name: UNITY_EMAIL"
          echo "    Value: 你注册 Unity 用的邮箱"
          echo "  - Name: UNITY_PASSWORD"
          echo "    Value: 你 Unity 账号的密码"
          echo ""
          echo "═══════════════════════════════════════════════"
          echo "✅ 配完后 push 任意改动 或 打 v1.0.0 tag 触发 CI,自动构建 APK"
          echo "═══════════════════════════════════════════════"

      - name: Self-check passed
        run: echo "✅ 项目自检通过,等配置 Unity 账号后切到真构建"

  # ============ 真构建模式:有 Unity 账号时跑 ============
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: ${{ secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: |
            Library/
            Temp/
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/lib/node_modules 2>/dev/null || true
          df -h /

      - name: Request Unity Personal License
        uses: game-ci/unity-request-activation-file@v1
        id: activation
        with:
          unityVersion: ${{ env.UNITY_VERSION }}

      - name: Activate Unity License
        uses: game-ci/unity-activate@v1
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          activationFile: ${{ steps.activation.outputs.filePath }}

      - name: Build Unity Project (Android)
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          projectPath: ${{ env.PROJECT_PATH }}
          buildName: dingfengbo
          buildsPath: ./Builds
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_NAME }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          allowDirtyBuild: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Return Unity License
        if: always()
        uses: game-ci/unity-return-license@v1
        with:
          unityVersion: ${{ env.UNITY_VERSION }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dingfengbo-android-apk
          path: ./Builds/Android/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./Builds/Android/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
