name: 构建安卓 APK

# 《定风波》云端构建 —— 你不需要电脑，也不需要装 Godot
# 推代码到 GitHub 后，GitHub 的服务器会自动帮你编译出 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:      # 也可以在网页上手动点按钮触发

permissions:
  contents: write         # 需要写权限，才能创建 Release 上传 APK

env:
  GODOT_VERSION: 4.3

jobs:
  build-android:
    name: 编译 APK
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest ndk;23.2.8474502'

      - name: 下载 Godot 4.3 编辑器 + 导出模板
        run: |
          set -e
          cd /tmp
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          # 导出模板（APK 编译必需）
          mkdir -p ~/.local/share/godot/export_templates/
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          godot --version

      - name: 生成调试签名
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 \
            -deststoretype pkcs12

      - name: 写入 Android 导出配置
        run: |
          cp .github/export_presets.cfg export_presets.cfg
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          cat export_presets.cfg | head -5

      - name: 导入工程（首次导入生成 .godot 缓存）
        run: godot --headless --editor --quit || true

      - name: 导出 APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" "build/定风波.apk" 2>&1 | tail -50
          echo "--- 产物 ---"
          ls -la build/

      - name: 上传 APK 作为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 定风波-APK
          path: build/*.apk
          retention-days: 90

      - name: 创建 Release 并附加 APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 《定风波》v1.0.${{ github.run_number }}
          body: |
            ## 《定风波》—— 水墨侠客

            莫听穿林打叶声，何妨吟啸且徐行。

            **下载 `定风波.apk` 安装到手机即可游玩。**

            操作：左下虚拟摇杆移动 · 右下「击」攻击 · 「避」闪避
          files: build/*.apk
          draft: false
          prerelease: false
