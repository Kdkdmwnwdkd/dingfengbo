name: 构建安卓 APK

# 《定风波》云端构建 —— 你不需要电脑，也不需要装 Godot
# 推代码到 GitHub 后，GitHub 的服务器会自动帮你编译出 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:      # 也可以在网页上手动点按钮触发

permissions:
  contents: write         # 需要写权限，才能创建 Release 上传 APK

env:
  GODOT_VERSION: 4.3

jobs:
  build-android:
    name: 编译 APK
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 注意：本工程使用 Godot 预编译的 Android 导出模板（非 Gradle 构建），
      # 因此不需要 NDK。装 NDK 只会白白多花几分钟且容易因版本号对不上而失败。
      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'
          log-accepted-android-sdk-licenses: true

      - name: 下载 Godot 4.3 编辑器 + 导出模板
        run: |
          set -e
          cd /tmp
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          # 导出模板（APK 编译必需）
          # tpz 解压后是 templates/ 目录，必须先建好目标目录再搬进去
          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL_DIR"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$TPL_DIR/"
          echo "--- 导出模板已就位 ---"
          ls "$TPL_DIR" | head -10
          godot --version

      - name: 安装固定调试签名
        run: |
          # 【重要】用仓库里固定的 keystore，不要每次重新生成！
          # 每次生成新密钥 = 每次签名指纹都不同 = 安卓认为这是"另一个应用"，
          # 结果是没法覆盖安装，用户每次升级都得先卸载。
          # debug 密钥本就不保密（密码就是公开的 android），所以直接入库。
          cp .github/debug.keystore "$HOME/debug.keystore"
          ls -la "$HOME/debug.keystore"
          echo "--- 签名指纹（每次构建都应是同一串）---"
          keytool -list -v -keystore "$HOME/debug.keystore" -storepass android 2>/dev/null | grep -E "SHA1|SHA256" | head -2

      - name: 配置 Godot 编辑器设置（关键！）
        run: |
          # Godot 的 Android 导出【不读】ANDROID_HOME 环境变量，
          # 只认编辑器设置里的 export/android/android_sdk_path。
          # 不写这一步，导出必然报 "configuration errors"。
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ]; then SDK="/usr/local/lib/android/sdk"; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          ES_DIR="$HOME/.config/godot"
          ES="$ES_DIR/editor_settings-${GODOT_VERSION}.tres"
          mkdir -p "$ES_DIR"

          # 先让 Godot 在工程目录下跑一次，生成默认的编辑器设置文件
          godot --headless --quit >/dev/null 2>&1 || true

          if [ ! -f "$ES" ]; then
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$ES"
          fi

          # 写入 SDK / JDK 路径与调试签名（有则替换，无则追加）
          set_kv() {
            local key="$1" val="$2"
            if grep -q "^${key} = " "$ES"; then
              sed -i "s|^${key} = .*|${key} = \"${val}\"|" "$ES"
            else
              echo "${key} = \"${val}\"" >> "$ES"
            fi
          }
          set_kv "export/android/android_sdk_path" "$SDK"
          set_kv "export/android/java_sdk_path" "${JAVA_HOME:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          set_kv "export/android/debug_keystore" "$HOME/debug.keystore"
          set_kv "export/android/debug_keystore_user" "androiddebugkey"
          set_kv "export/android/debug_keystore_pass" "android"

          echo "--- 编辑器设置已写入：$ES ---"
          grep -E "^export/android" "$ES"

      - name: 写入 Android 导出配置
        run: |
          cp .github/export_presets.cfg export_presets.cfg
          # keystore 绝对路径按当前 runner 的 $HOME 实际值替换
          sed -i "s|/home/runner/debug.keystore|$HOME/debug.keystore|g" export_presets.cfg

          # 把真实版本号写进 APK 内部（安卓系统读这两项）
          #   version/code —— 必须是整数，安卓用它判断「是否新版本」，每次构建递增
          #   version/name —— 显示给用户看的字符串，和 Release 标签保持一致
          # 不写这一步，APK 里永远是写死的 1 / "1.0"，装完只会显示 1.0
          sed -i "s|^version/code=.*|version/code=${{ github.run_number }}|" export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"1.0.${{ github.run_number }}\"|" export_presets.cfg
          echo "--- 本次版本号 ---"
          grep -E "^version/" export_presets.cfg
          echo "--- 签名与路径 ---"
          grep -E "keystore/debug|export_path" export_presets.cfg

      - name: 导入工程（首次导入生成 .godot 缓存）
        run: |
          # --import 比 --editor --quit 更适合 CI：不需要图形界面，且会返回真实退出码
          godot --headless --import 2>&1 | tail -30
          echo "--- 导入完成，检查缓存 ---"
          ls -d .godot 2>/dev/null && echo ".godot 已生成" || echo "警告：.godot 未生成"

      - name: 导出 APK
        run: |
          mkdir -p build
          # 用 PIPESTATUS 拿到 godot 的真实退出码，不再被 tail 吞掉（避免"假绿"）
          set +e
          godot --headless --verbose --export-debug "Android" "build/dingfengbo.apk" 2>&1 | tail -60
          RC=${PIPESTATUS[0]}
          set -e
          echo "--- 产物 ---"
          ls -la build/
          if [ "$RC" -ne 0 ] || ! ls build/*.apk >/dev/null 2>&1; then
            echo "::error::APK 导出失败（godot 退出码 $RC）"
            exit 1
          fi
          echo "APK 导出成功"
          ls -la build/*.apk

      - name: Patch AndroidManifest 强制 sensorLandscape
        # 根因：Godot 4.3 导出器把 project.godot 的 handheld/orientation 映射到
        # AndroidManifest 的 screenOrientation 时存在偏差（SENSOR_LANDSCAPE=5 应映射
        # 到 userLandscape=11，实际产出 userPortrait=12）→ 国产 ROM 直接按竖屏渲染
        # → 画面 letterbox → HUD 触摸坐标错位 → 怎么点都动不了。
        # 修复：Godot 导出后用 apktool 解包，把 screenOrientation 改成 sensorLandscape
        # （走重力传感器，国产 ROM 通常遵守），再重打包+zipalign+签名。
        run: |
          set -e
          cd build
          # 下载 apktool
          wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" -O /tmp/apktool.jar
          # 解包 APK
          java -jar /tmp/apktool.jar d -f dingfengbo.apk -o decoded
          # 把所有 activity 的 screenOrientation 强制改成 sensorLandscape
          # （GodotApp 是主 Activity；其他 activity 通常是 -1/未指定，sed 只改显式赋值的）
          sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="sensorLandscape"/g' decoded/AndroidManifest.xml
          echo "--- patch 后 manifest 的 screenOrientation ---"
          grep -o 'screenOrientation="[^"]*"' decoded/AndroidManifest.xml | head -5
          # 重打包
          java -jar /tmp/apktool.jar b decoded -o patched_unsigned.apk
          # 找 build-tools 路径
          BT=$(ls -d ${ANDROID_HOME}/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          echo "build-tools: $BT"
          # zipalign 4 字节对齐（V2 签名前置要求）
          "${BT}zipalign" -f -v 4 patched_unsigned.apk patched_aligned.apk
          # 用固定 debug keystore 签名（与导出时同一密钥，指纹一致，可覆盖安装）
          "${BT}apksigner" sign --ks "$HOME/debug.keystore" --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android patched_aligned.apk
          # 验签
          "${BT}apksigner" verify --verbose patched_aligned.apk | head -5
          # 替换原 APK
          mv patched_aligned.apk dingfengbo.apk
          rm -f patched_unsigned.apk
          echo "--- patch 完成，最终 APK ---"
          ls -la dingfengbo.apk
          # 重命名带版本号
          cp "dingfengbo.apk" "dingfengbo-v1.0.${GITHUB_RUN_NUMBER}.apk"

      - name: 上传 APK 作为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 定风波-APK
          path: build/dingfengbo-v*.apk
          if-no-files-found: error
          retention-days: 90

      - name: 创建 Release 并附加 APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 《定风波》v1.0.${{ github.run_number }}
          body: |
            ## 《定风波》—— 水墨侠客

            莫听穿林打叶声，何妨吟啸且徐行。

            竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。

            ---

            **安装方法**：下载下面的 `.apk` 文件 → 用手机点开 → 允许「安装未知来源应用」→ 装好后即可游玩。

            **操作**：左下虚拟摇杆移动 · 右下「击」攻击（三连击）· 「避」闪避（带无敌帧）

            ---

            *本 APK 使用 Godot 4.3 云端编译，已通过 v1/v2/v3 签名校验，支持 Android 5.0+*
          files: build/dingfengbo-v*.apk
          draft: false
          prerelease: false
